<script>
const C={"pt": {"back": "← Voltar ao site", "eyebrow": "Case técnico · MLOps de triagem médica", "h1a": "Triagem de", "h1b": "Textos Médicos", "lead": "Um sistema que lê um texto médico e indica a área clínica e o nível de atenção. O foco vai além do modelo: é o serviço inteiro em volta dele — dados limpos, retreino automático, testes, monitoramento e uma API rápida.", "live": "API ao vivo ↗", "github": "GitHub ↗", "lab": "Testar no Live Lab →", "p1e": "01 · Problema", "p1h": "Ler um texto médico e saber o quão rápido ele merece atenção.", "p1c": "Em um fluxo de atendimento, textos médicos chegam em grande volume e alguém precisa decidir o que olhar primeiro. O projeto classifica um texto em cinco áreas médicas e transforma isso em um nível de atenção — normal, atenção ou urgente — para apoiar a priorização.", "p2e": "02 · Modelagem", "p2h": "Dados limpos antes de modelos sofisticados.", "p2c": "O dataset tinha um problema: alguns resumos apareciam com mais de uma categoria, ou seja, o mesmo texto com rótulos conflitantes. Removi esses casos em treino e teste, ficando com 6.607 textos de treino e 1.691 de teste. O modelo é um TF-IDF (palavras e pares de palavras) com Random Forest de 200 árvores e pesos de classe balanceados. Como referência, um modelo que chuta sempre a classe mais comum acerta cerca de 28%.", "dec": "Decisão de modelagem", "decc": "Escolhi um modelo simples, rápido de treinar e fácil de explicar. A métrica que mais importa aqui não é a média geral, e sim não deixar passar casos urgentes: o recall dos urgentes é 0,85, e um modelo retreinado só vai para produção se esse recall ficar acima de 0,80.", "p3e": "03 · Urgência", "p3h": "Urgência é uma regra de negócio, não uma previsão do modelo.", "p3c": "O modelo prevê a área médica. O nível de atenção vem de uma tabela editável (um arquivo JSON) que associa cada área a normal, atenção ou urgente. Assim, a regra pode ser revisada por quem entende do assunto sem retreinar nada.", "dec2": "Limite assumido", "decc2": "Essa tabela é um rótulo aproximado que eu criei, não uma validação clínica. Por exemplo, todo texto cardiovascular é marcado como urgente, até um estudo sobre remédio para pressão. É um protótipo de estudo, e isso está dito no site e no README.", "p4e": "04 · Engenharia", "p4h": "Do experimento a um serviço que se mantém sozinho.", "s1": "Pipeline semanal com quatro etapas: preparar os dados, treinar, exportar para ONNX e avaliar. O novo modelo só substitui o atual se passar nas verificações de qualidade.", "s2": "Converti a floresta para ONNX e reduzi a latência mediana de 28 ms para 2,3 ms, sem limite de CPU. As previsões são as mesmas: em 1.691 textos, só 4 diferiram, todos empates exatos.", "s3": "API com validação de entrada e endpoints de saúde, métricas e previsão.", "s4": "Imagem com usuário sem privilégios e health check, publicada no GitHub Container Registry.", "s5": "Métricas de requisições, latência e tempo de inferência coletadas pelo Prometheus e exibidas em um painel Grafana com 7 gráficos.", "s6": "14 testes, rodando nos dois backends, e verificação de estilo com ruff a cada push.", "p5e": "05 · Resultado", "p5h": "Um modelo suficiente, dentro de um sistema em que dá para confiar.", "p5c": "O projeto permite discutir métricas, mas também decisões de engenharia: limpeza de rótulos, regras de promoção, otimização de latência com checagem de equivalência e monitoramento. Os números são do conjunto de teste e dependem do rótulo de urgência aproximado descrito acima.", "dec3": "Decisão para a demo", "decc3": "A demo online roda o modelo scikit-learn, não o ONNX, porque o ONNX precisa de cerca de 516 MiB de memória e o plano gratuito do Render tem 512 MB. Testei com os limites do plano gratuito (1/10 de CPU): o serviço sobe em cerca de 70 segundos e responde em torno de 105 ms. Por isso o primeiro acesso pode demorar enquanto o servidor acorda.", "m1": "URGENT RECALL", "m2": "F1-MACRO", "m3": "LATÊNCIA P50 (ONNX)", "next": "Próximo case · Sistema de Recomendação →"}, "en": {"back": "← Back to site", "eyebrow": "Technical case · Medical triage MLOps", "h1a": "Medical Text", "h1b": "Triage", "lead": "A system that reads a medical text and indicates the clinical area and attention level. The focus goes beyond the model: it is the whole service around it — clean data, automatic retraining, tests, monitoring and a fast API.", "live": "Live API ↗", "github": "GitHub ↗", "lab": "Try it in the Live Lab →", "p1e": "01 · Problem", "p1h": "Read a medical text and know how quickly it deserves attention.", "p1c": "In a care workflow, medical texts arrive in volume and someone has to decide what to look at first. The project classifies a text into five medical areas and turns that into an attention level — normal, attention or urgent — to support prioritization.", "p2e": "02 · Modeling", "p2h": "Clean data before sophisticated models.", "p2c": "The dataset had a problem: some abstracts appeared under more than one category, meaning the same text carried conflicting labels. I removed those cases from both train and test, leaving 6,607 training texts and 1,691 test texts. The model is a TF-IDF (words and word pairs) with a 200-tree Random Forest and balanced class weights. For reference, a model that always guesses the most common class is right about 28% of the time.", "dec": "Modeling decision", "decc": "I chose a simple model that is fast to train and easy to explain. The metric that matters most here is not the overall average but not missing urgent cases: urgent recall is 0.85, and a retrained model only reaches production if that recall stays above 0.80.", "p3e": "03 · Urgency", "p3h": "Urgency is a business rule, not a model prediction.", "p3c": "The model predicts the medical area. The attention level comes from an editable table (a JSON file) that maps each area to normal, attention or urgent. That way the rule can be reviewed by a domain expert without retraining anything.", "dec2": "Acknowledged limit", "decc2": "That table is an approximate label I created, not clinical validation. For example, every cardiovascular text is marked urgent, even a study on blood pressure medication. This is a study prototype, and the site and README say so.", "p4e": "04 · Engineering", "p4h": "From experiment to a service that maintains itself.", "s1": "Weekly four-step pipeline: prepare data, train, export to ONNX and evaluate. The new model only replaces the current one if it passes the quality checks.", "s2": "I converted the forest to ONNX and cut median latency from 28 ms to 2.3 ms, without a CPU limit. Predictions are equivalent: out of 1,691 texts, only 4 differed, all exact ties.", "s3": "API with input validation and health, metrics and prediction endpoints.", "s4": "Image with an unprivileged user and a health check, published to the GitHub Container Registry.", "s5": "Request, latency and inference-time metrics collected by Prometheus and shown in a 7-panel Grafana dashboard.", "s6": "14 tests, running on both backends, plus ruff style checks on every push.", "p5e": "05 · Outcome", "p5h": "A good-enough model inside a system you can trust.", "p5c": "The project supports discussion of metrics, but also engineering decisions: label cleaning, promotion rules, latency optimization with an equivalence check, and monitoring. The numbers are from the test set and depend on the approximate urgency label described above.", "dec3": "Demo decision", "decc3": "The online demo runs the scikit-learn model, not ONNX, because ONNX needs about 516 MiB of memory and Render's free plan has 512 MB. I tested with the free plan's limits (1/10 of a CPU): the service starts in about 70 seconds and answers in around 105 ms. That is why the first visit can take a while as the server wakes up.", "m1": "URGENT RECALL", "m2": "F1-MACRO", "m3": "P50 LATENCY (ONNX)", "next": "Next case · Recommender System →"}}; let lang=localStorage.getItem("gf-lang")||"pt"; if(!C[lang])lang="pt";
const ids=["back","eyebrow","h1a","h1b","lead","live","github","lab","p1e","p1h","p1c","p2e","p2h","p2c","dec","decc","p3e","p3h","p3c","p4e","p4h","s1","s2","s3","s4","s5","s6","dec2","decc2","dec3","decc3","p5e","p5h","p5c","next"];
function render(){
 const t=C[lang]; document.documentElement.lang=lang==="pt"?"pt-BR":"en";
 ids.forEach(id=>{const el=document.getElementById(id); if(el && t[id]!==undefined)el.textContent=t[id];});
 document.querySelectorAll(".metric span").forEach(el=>el.textContent=t[el.dataset.k]);
 document.getElementById("pt").classList.toggle("active",lang==="pt");document.getElementById("en").classList.toggle("active",lang==="en");
}
document.getElementById("pt").onclick=()=>{lang="pt";localStorage.setItem("gf-lang",lang);render()};
document.getElementById("en").onclick=()=>{lang="en";localStorage.setItem("gf-lang",lang);render()};
document.getElementById("year").textContent=new Date().getFullYear(); render();
</script></body></html>
