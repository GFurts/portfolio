<style>
*{box-sizing:border-box;margin:0;padding:0}:root{--bg:#07111f;--surface:#0d1b2d;--line:rgba(148,163,184,.16);--line2:rgba(148,163,184,.28);--text:#f7f9fc;--muted:#a3afbf;--faint:#64748b;--accent:#57d39b;--accent2:#f2b84b;--max:1000px;--display:'Manrope',sans-serif;--body:'DM Sans',sans-serif;--mono:'JetBrains Mono',monospace}

.hero{padding:156px 0 92px;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;right:8%;bottom:20px;width:180px;height:180px;border:1px solid color-mix(in srgb,var(--accent) 20%,transparent);border-radius:50%;opacity:.7}.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.17em;text-transform:uppercase;color:var(--accent)}h1{font-family:var(--display);font-size:clamp(58px,9vw,102px);line-height:.93;letter-spacing:-.065em;font-weight:650;margin-top:19px;max-width:900px}h1 span{color:var(--accent)}.lead{font-size:18px;color:var(--muted);max-width:790px;margin-top:30px;line-height:1.85}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:30px}.btn{display:inline-flex;align-items:center;min-height:42px;padding:0 17px;border:1px solid var(--line2);border-radius:10px;text-decoration:none;font-size:12px;font-weight:600;transition:.2s}.btn:hover{transform:translateY(-1px);border-color:color-mix(in srgb,var(--accent) 55%,transparent)}.primary{background:white;color:#08111f;border-color:white}

section{padding:92px 0;border-bottom:1px solid var(--line)}.head{display:grid;grid-template-columns:170px 1fr;gap:40px;margin-bottom:38px}.head h2{font-family:var(--display);font-size:clamp(31px,4vw,48px);letter-spacing:-.04em;line-height:1.08}.copy{color:var(--muted);max-width:790px;font-size:15px;line-height:1.85}.decision{margin-top:28px;padding:22px 24px;border-left:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 4%,transparent)}.decision b{display:block;font-size:13px;margin-bottom:6px}.decision p{font-size:13px;color:var(--muted)}.steps{border-top:1px solid var(--line)}.step{display:grid;grid-template-columns:50px 1fr;gap:14px;padding:22px 0;border-bottom:1px solid var(--line)}.num{font-family:var(--mono);font-size:10px;color:var(--accent)}.step h3{font-size:14px;margin-bottom:4px}.step p{font-size:12px;color:var(--muted)}.next{padding:70px 0}.next a{display:flex;justify-content:space-between;align-items:center;text-decoration:none;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:28px 0;font-family:var(--display);font-size:clamp(22px,3vw,34px);font-weight:600;letter-spacing:-.03em}.next a:hover{color:var(--accent)}footer{padding:34px 0;font-family:var(--mono);font-size:9px;color:var(--faint);text-align:center}

<script>
const C={"pt": {"back": "← Voltar ao site", "eyebrow": "Case técnico · Risco Educacional", "h1a": "Risco", "h1b": "Educacional", "lead": "Um projeto para ajudar a identificar alunos que podem precisar de mais atenção, usando dados históricos para apoiar — e não substituir — a decisão humana.", "live": "Dashboard ao vivo ↗", "github": "GitHub ↗", "lab": "Voltar aos trabalhos →", "p1e": "01 · Problema", "p1h": "Alguns sinais precisam aparecer cedo.", "p1c": "Em uma organização social, tempo e atenção são recursos limitados. O projeto busca destacar alunos que podem precisar de acompanhamento antes que dificuldades importantes passem despercebidas.", "p2e": "02 · Dados", "p2h": "Três anos de informações precisavam falar a mesma língua.", "p2c": "O dataset foi unificado a partir de dados do survey PEDE de 2022, 2023 e 2024. O trabalho incluiu tratamento de inconsistências entre períodos e boas práticas de LGPD na preparação dos dados.", "dec": "Decisão de modelagem", "decc": "Usei threshold 0.4 para dar mais peso à identificação dos casos de risco. Em termos simples: preferi aumentar a chance de encontrar quem precisa de atenção, mesmo aceitando mais alertas para revisão.", "p3e": "03 · Avaliação", "p3h": "Aqui, deixar um caso importante passar pesa mais.", "p3c": "Com threshold 0.4, o modelo alcançou recall de 0.89. O ROC-AUC de 0.648 é apresentado junto com o threshold para deixar explícito o trade-off adotado no uso do modelo.", "p4e": "04 · Produto", "p4h": "Da previsão ao apoio à decisão.", "s1": "XGBoost como modelo preditivo principal.", "s2": "Pipeline de preparação com dados PEDE 2022–2024.", "s3": "Threshold 0.4 configurado para alto recall.", "s4": "Streamlit como interface interativa para a equipe.", "s5": "pytest e scikit-learn compondo o fluxo técnico.", "p5e": "05 · Resultado", "p5h": "O resultado precisava ser útil para quem toma a decisão.", "p5c": "O valor do projeto não está apenas na métrica. Ele conecta limpeza de dados, decisão de threshold, preocupação com privacidade e uma interface que aproxima o resultado do modelo de quem precisa utilizá-lo.", "m1": "ROC-AUC", "m2": "RECALL", "m3": "THRESHOLD", "next": "Voltar ao projeto principal · Recommender →"}, "en": {"back": "← Back to site", "eyebrow": "Technical case · Educational Risk", "h1a": "Educational", "h1b": "Risk", "lead": "A project designed to help identify students who may need more attention, using historical data to support — not replace — human decision-making.", "live": "Live dashboard ↗", "github": "GitHub ↗", "lab": "Back to work →", "p1e": "01 · Problem", "p1h": "Some warning signs need to appear early.", "p1c": "In a social organization, time and attention are limited resources. The project aims to highlight students who may need follow-up before important difficulties go unnoticed.", "p2e": "02 · Data", "p2h": "Three years of information needed to speak the same language.", "p2c": "The dataset was unified from PEDE survey data for 2022, 2023 and 2024. The work included handling inconsistencies across periods and applying LGPD-oriented data preparation practices.", "dec": "Modeling decision", "decc": "I used a 0.4 threshold to place more weight on finding risk cases. In simple terms, I preferred to increase the chance of finding students who need attention, even if that creates more alerts for review.", "p3e": "03 · Evaluation", "p3h": "Here, missing an important case matters more.", "p3c": "At a 0.4 threshold, the model reached 0.89 recall. The 0.648 ROC-AUC is shown alongside the threshold to make the chosen trade-off explicit.", "p4e": "04 · Product", "p4h": "From prediction to decision support.", "s1": "XGBoost as the main predictive model.", "s2": "Data-preparation pipeline using PEDE 2022–2024.", "s3": "A 0.4 operating threshold configured for high recall.", "s4": "Streamlit as an interactive interface for the team.", "s5": "pytest and scikit-learn as part of the technical workflow.", "p5e": "05 · Outcome", "p5h": "The result needed to be useful to the person making the decision.", "p5c": "The project's value is not only in the metric. It connects data cleaning, threshold choice, privacy awareness and an interface that brings model output closer to the people who need to use it.", "m1": "ROC-AUC", "m2": "RECALL", "m3": "THRESHOLD", "next": "Back to featured case · Recommender →"}}; let lang=localStorage.getItem("gf-lang")||"pt"; if(!C[lang])lang="pt";

function render(){
 const t=C[lang]; document.documentElement.lang=lang==="pt"?"pt-BR":"en";
 ids.forEach(id=>{const el=document.getElementById(id); if(el && t[id]!==undefined)el.textContent=t[id];});
 document.querySelectorAll(".metric span").forEach(el=>el.textContent=t[el.dataset.k]);
 document.getElementById("pt").classList.toggle("active",lang==="pt");document.getElementById("en").classList.toggle("active",lang==="en");
}
document.getElementById("pt").onclick=()=>{lang="pt";localStorage.setItem("gf-lang",lang);render()};
document.getElementById("en").onclick=()=>{lang="en";localStorage.setItem("gf-lang",lang);render()};

</script></body></html>
