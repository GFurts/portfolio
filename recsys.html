<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GF — Recommender System Case</title>
<meta name="description" content="Case técnico do Sistema de Recomendação RetailRocket de Gabriel Furtado.">
<meta name="theme-color" content="#07111f"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%2307111f'/%3E%3Crect x='3' y='3' width='58' height='58' rx='6' fill='none' stroke='%233b82f6' stroke-width='2'/%3E%3Ctext x='32' y='40' font-family='Arial,sans-serif' font-size='24' font-weight='700' text-anchor='middle' fill='white'%3EGF%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}:root{--bg:#07111f;--surface:#0d1b2d;--line:rgba(148,163,184,.16);--line2:rgba(148,163,184,.28);--text:#f7f9fc;--muted:#a3afbf;--faint:#64748b;--blue:#4f8cff;--cyan:#4dd8e7;--max:1000px;--display:'Manrope',sans-serif;--body:'DM Sans',sans-serif;--mono:'JetBrains Mono',monospace}
html{scroll-behavior:smooth}body{background:radial-gradient(800px 500px at 80% 0%,rgba(79,140,255,.10),transparent 60%),var(--bg);color:var(--text);font-family:var(--body);line-height:1.7;-webkit-font-smoothing:antialiased}a{color:inherit}.shell{width:min(var(--max),calc(100% - 56px));margin:auto}
header{height:74px;position:fixed;inset:0 0 auto;z-index:20;background:rgba(7,17,31,.8);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}nav{height:74px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:11px;text-decoration:none}.mark{width:34px;height:34px;border:1px solid rgba(79,140,255,.55);border-radius:8px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:13px}.back{font-family:var(--mono);font-size:10px;color:var(--muted)}.lang{display:flex;gap:5px;align-items:center;font-family:var(--mono);font-size:10px;color:var(--faint)}.lang button{border:0;background:none;color:var(--faint);cursor:pointer;padding:5px}.lang button.active{color:#76a7ff}
.hero{padding:156px 0 92px}.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.17em;text-transform:uppercase;color:#76a7ff}h1{font-family:var(--display);font-size:clamp(58px,9vw,102px);line-height:.93;letter-spacing:-.065em;font-weight:650;margin-top:19px;max-width:900px}h1 span{color:var(--cyan)}.lead{font-size:18px;color:var(--muted);max-width:760px;margin-top:30px;line-height:1.85}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:30px}.btn{display:inline-flex;align-items:center;min-height:42px;padding:0 17px;border:1px solid var(--line2);border-radius:10px;text-decoration:none;font-size:12px;font-weight:600}.primary{background:white;color:#08111f;border-color:white}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.metric{padding:30px;border-right:1px solid var(--line)}.metric:last-child{border-right:0}.metric strong{font-family:var(--display);font-size:34px;color:var(--cyan);letter-spacing:-.04em}.metric span{display:block;font-family:var(--mono);font-size:9px;color:var(--faint);margin-top:3px}
section{padding:92px 0;border-bottom:1px solid var(--line)}.head{display:grid;grid-template-columns:170px 1fr;gap:40px;margin-bottom:38px}.head h2{font-family:var(--display);font-size:clamp(31px,4vw,48px);letter-spacing:-.04em;line-height:1.08}.copy{color:var(--muted);max-width:760px;font-size:15px;line-height:1.85}.decision{margin-top:28px;padding:22px 24px;border-left:2px solid var(--cyan);background:rgba(77,216,231,.035)}.decision b{display:block;font-size:13px;margin-bottom:6px}.decision p{font-size:13px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line);margin-top:28px}.card{padding:24px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.card h3{font-family:var(--display);font-size:17px;margin-bottom:9px}.card p{font-size:12px;color:var(--muted)}.steps{border-top:1px solid var(--line)}.step{display:grid;grid-template-columns:50px 1fr;gap:14px;padding:22px 0;border-bottom:1px solid var(--line)}.num{font-family:var(--mono);font-size:10px;color:var(--cyan)}.step h3{font-size:14px;margin-bottom:4px}.step p{font-size:12px;color:var(--muted)}footer{padding:34px 0;font-family:var(--mono);font-size:9px;color:var(--faint);text-align:center}
@media(max-width:700px){.shell{width:calc(100% - 30px)}.head{grid-template-columns:1fr;gap:12px}.grid{grid-template-columns:1fr}.metrics{grid-template-columns:1fr}.metric{border-right:0;border-bottom:1px solid var(--line)}.metric:last-child{border-bottom:0}}
</style></head>
<body>
<header><nav class="shell"><a class="brand" href="./index.html"><span class="mark">GF</span><span class="back" id="back">← Voltar ao site</span></a><div class="lang"><button id="pt" class="active">PT</button><span>/</span><button id="en">EN</button></div></nav></header>
<main id="app"></main><footer>Gabriel Furtado · Data Scientist & ML Engineer · <span id="year"></span></footer>
<script>
const C={
pt:{
back:"← Voltar ao site",eyebrow:"Case técnico · Sistema de Recomendação",h1a:"Sistema de",h1b:"Recomendação",
lead:"Motor de recomendação para e-commerce construído sobre dados do RetailRocket, com embeddings em PyTorch, avaliação por métricas de ranking e um pipeline reproduzível com DVC, MLflow, FastAPI e Docker.",
live:"API ao vivo ↗",github:"GitHub ↗",lab:"Testar no Live Lab →",
p1e:"01 · Problema",p1h:"Personalização é um problema de ranking.",p1c:"Listagens genéricas reduzem a relevância da experiência de compra. O objetivo é transformar histórico de interações em um ranking personalizado de itens para cada usuário.",
p2e:"02 · Modelagem",p2h:"Embeddings para aprender relações latentes.",p2c:"Usuários e itens são representados em espaços densos aprendidos pelo modelo. Isso permite capturar padrões de interação que IDs brutos não carregam.",
dec:"Decisão de modelagem",decc:"O produto final é uma lista ordenada de itens. Por isso, o sucesso do modelo precisa ser medido com métricas de ranking — e não apenas métricas tradicionais de classificação.",
p3e:"03 · Avaliação",p3h:"Métricas que refletem o produto final.",prec:"Quanto do Top 10 recomendado é relevante.",rec:"Quanto dos itens relevantes o Top 10 consegue recuperar.",ndcg:"Leva em conta também a posição dos itens relevantes no ranking.",
p4e:"04 · Engenharia",p4h:"Do experimento ao serviço.",s1:"Pipeline DVC em 4 estágios reproduzíveis.",s2:"MLflow para tracking e organização de versões.",s3:"11 testes automatizados com pytest.",s4:"Docker para padronizar o ambiente.",s5:"FastAPI para servir recomendações via REST.",
p5e:"05 · Por que importa",p5h:"Um case de ML Engineering, não só de modelagem.",p5c:"O projeto permite discutir representação, ranking, dados, versionamento, experimentação, testes, containerização e serving como partes de um único sistema."
},
en:{
back:"← Back to site",eyebrow:"Technical case · Recommender System",h1a:"Recommender",h1b:"System",
lead:"E-commerce recommendation engine built on RetailRocket data, with PyTorch embeddings, ranking-based evaluation and a reproducible pipeline using DVC, MLflow, FastAPI and Docker.",
live:"Live API ↗",github:"GitHub ↗",lab:"Try it in the Live Lab →",
p1e:"01 · Problem",p1h:"Personalization is a ranking problem.",p1c:"Generic listings reduce shopping relevance. The goal is to turn interaction history into a personalized ranking of items for each user.",
p2e:"02 · Modeling",p2h:"Embeddings to learn latent relationships.",p2c:"Users and items are represented as dense vectors learned by the model. This captures interaction patterns that raw IDs cannot express.",
dec:"Modeling decision",decc:"The final product is an ordered list of items. Model success therefore needs ranking metrics — not only traditional classification metrics.",
p3e:"03 · Evaluation",p3h:"Metrics that reflect the final product.",prec:"How much of the recommended Top 10 is relevant.",rec:"How much of the relevant set the Top 10 retrieves.",ndcg:"Also accounts for where relevant items appear in the ranking.",
p4e:"04 · Engineering",p4h:"From experiment to service.",s1:"A reproducible 4-stage DVC pipeline.",s2:"MLflow for experiment tracking and model organization.",s3:"11 automated tests with pytest.",s4:"Docker to standardize the runtime environment.",s5:"FastAPI to serve recommendations over REST.",
p5e:"05 · Why it matters",p5h:"An ML Engineering case, not just a modeling exercise.",p5c:"The project supports discussion about representation learning, ranking, data, versioning, experimentation, tests, containers and serving as parts of one system."
}};
let lang=localStorage.getItem("gf-lang")||"pt";if(!C[lang])lang="pt";
const app=document.getElementById("app"),back=document.getElementById("back"),pt=document.getElementById("pt"),en=document.getElementById("en");
function render(){
const t=C[lang];document.documentElement.lang=lang==="pt"?"pt-BR":"en";back.textContent=t.back;pt.classList.toggle("active",lang==="pt");en.classList.toggle("active",lang==="en");
app.innerHTML=`<section class="hero"><div class="shell"><div class="eyebrow">${t.eyebrow}</div><h1>${t.h1a}<br><span>${t.h1b}</span></h1><p class="lead">${t.lead}</p><div class="actions"><a class="btn primary" href="https://recsys-retailrocket.onrender.com/docs" target="_blank">${t.live}</a><a class="btn" href="https://github.com/GFurts/recsys-retailrocket" target="_blank">${t.github}</a><a class="btn" href="./index.html#lab">${t.lab}</a></div></div></section>
<div class="metrics"><div class="metric"><strong>0.74</strong><span>PRECISION@10</span></div><div class="metric"><strong>0.68</strong><span>RECALL@10</span></div><div class="metric"><strong>0.71</strong><span>NDCG</span></div></div>
<section><div class="shell"><div class="head"><div class="eyebrow">${t.p1e}</div><h2>${t.p1h}</h2></div><p class="copy">${t.p1c}</p></div></section>
<section><div class="shell"><div class="head"><div class="eyebrow">${t.p2e}</div><h2>${t.p2h}</h2></div><p class="copy">${t.p2c}</p><div class="decision"><b>${t.dec}</b><p>${t.decc}</p></div></div></section>
<section><div class="shell"><div class="head"><div class="eyebrow">${t.p3e}</div><h2>${t.p3h}</h2></div><div class="grid"><div class="card"><h3>Precision@10</h3><p>${t.prec}</p></div><div class="card"><h3>Recall@10</h3><p>${t.rec}</p></div><div class="card"><h3>NDCG</h3><p>${t.ndcg}</p></div></div></div></section>
<section><div class="shell"><div class="head"><div class="eyebrow">${t.p4e}</div><h2>${t.p4h}</h2></div><div class="steps"><div class="step"><div class="num">01</div><div><h3>DVC</h3><p>${t.s1}</p></div></div><div class="step"><div class="num">02</div><div><h3>MLflow</h3><p>${t.s2}</p></div></div><div class="step"><div class="num">03</div><div><h3>pytest</h3><p>${t.s3}</p></div></div><div class="step"><div class="num">04</div><div><h3>Docker</h3><p>${t.s4}</p></div></div><div class="step"><div class="num">05</div><div><h3>FastAPI</h3><p>${t.s5}</p></div></div></div></div></section>
<section><div class="shell"><div class="head"><div class="eyebrow">${t.p5e}</div><h2>${t.p5h}</h2></div><p class="copy">${t.p5c}</p></div></section>`;
}
pt.onclick=()=>{lang="pt";localStorage.setItem("gf-lang",lang);render()};en.onclick=()=>{lang="en";localStorage.setItem("gf-lang",lang);render()};document.getElementById("year").textContent=new Date().getFullYear();render();
</script></body></html>
