<script>
const C={"pt": {"back": "← Voltar ao site", "eyebrow": "Case técnico · Observabilidade de modelos em produção", "h1a": "Credit Scoring", "h1b": "Observability", "lead": "Um modelo de crédito continua respondendo mesmo quando piora: nada quebra, mas as decisões ficam piores em silêncio. Este projeto é a camada que percebe isso — contrato de dados, detecção de drift, alertas, painéis, análise de causa e governança conforme a LGPD.", "github": "GitHub ↗", "lab": "← Ver outros projetos", "m1": "AUC: BASE → PERÍODO 4", "m2": "QUEDA DE AUC SÓ POR CONCEPT DRIFT", "m3": "LOTE RUIM BLOQUEADO (VIOLAÇÕES)", "p1e": "01 · Problema", "p1h": "Um modelo pode piorar sem dar nenhum erro.", "p1c": "Uma fintech lança um modelo de score com AUC 0,791. Meses depois, faturas crescem, mais clientes atrasam e o público fica mais jovem. O modelo segue respondendo, mas aprova e nega as pessoas erradas. O desafio é perceber isso cedo, entender a causa e saber o que fazer. Usei a base pública UCI Default of Credit Card Clients (30 mil clientes, Taiwan, 2005) e simulei quatro períodos de produção com piora crescente.", "p2e": "02 · Qualidade de dados", "p2h": "Dado ruim é barrado antes de virar decisão.", "p2c": "Cada lote passa por um contrato de dados (Pandera) antes de chegar ao modelo: idade entre 18 e 100, categorias válidas, ids únicos, pagamentos não negativos e nenhuma coluna inesperada. Corrompi 500 linhas de propósito e o contrato apontou 81 violações em 7 verificações, bloqueou o lote e saiu com erro. O treino também se recusa a rodar com dados que falham no contrato.", "dec": "Decisão de projeto", "decc": "O contrato mede validade, não semelhança. Um lote com rendas mais altas é válido; perceber que ele mudou é trabalho da camada de drift. Separar as duas coisas evita bloquear dado legítimo só porque o mundo mudou.", "p3e": "03 · Drift e causa", "p3h": "Drift alto não significa perda de desempenho.", "p3c": "Comparei cada período com a referência usando PSI (o tamanho da mudança) e KS (se a diferença é estatisticamente real), com relatórios do Evidently. Entre o primeiro e o quarto período o AUC caiu de 0,788 para 0,649. Para descobrir o motivo, liguei uma causa de cada vez no simulador, com 30 repetições. Todas as mudanças nas variáveis de entrada juntas custaram cerca de 0,011 de AUC; a mudança no comportamento de pagamento (concept drift) sozinha custou 0,128.", "dec2": "O que isso mostra", "decc2": "Variáveis como idade (PSI 0,50) cruzaram o limite de alerta, mas quase não afetaram o modelo. O dano veio de uma mudança na relação entre perfil e inadimplência, que só o desempenho revela. Por isso o alerta de queda de AUC dispara um lote antes do alerta de PSI. A análise vale para o simulador e as proporções dependem das intensidades que escolhi.", "p4e": "04 · Engenharia", "p4h": "Do relatório pontual a um sistema que vigia sozinho.", "s1": "Valida o contrato, bloqueia lotes inválidos e interrompe o treino com dado ruim. 81 violações detectadas no lote de teste.", "s2": "PSI e KS por variável e por período, com relatórios HTML. As variáveis que não alterei ficam quietas: o detector aponta os culpados certos.", "s3": "Cada lote passa por contrato, previsão, drift e regras de alerta (crítico ou atenção), com logs em JSON sem dados individuais e métricas por lote no MLflow.", "s4": "Métricas expostas por prometheus_client, regras de alerta e um painel provisionado automaticamente com 13 gráficos. O replay completo gerou 7 alertas críticos.", "s5": "Experimento intervencional: sete cenários, uma causa por vez, 30 sementes cada. Separa o efeito dos dados do efeito do conceito.", "s6": "Testes das regras de alerta, do contrato e do simulador, e GitHub Actions rodando a suíte a cada push. Os testes que dependem dos dados reais são pulados no CI.", "p5e": "05 · Governança", "p5h": "LGPD e justiça fazem parte do sistema, não de um anexo.", "p5c": "O repositório documenta inventário de dados, base legal (Art. 7, X, proteção do crédito), o direito de revisão de decisões automatizadas (Art. 20), plano de retenção e um playbook de operação. Sexo e id ficam fora do modelo. Auditei taxas de sinalização, TPR e FPR por sexo, faixa etária e estado civil, e testei se as outras variáveis permitem prever o sexo.", "dec3": "Limite assumido", "decc3": "O teste de proxy previu o sexo com AUC 0,649 (controle com rótulos embaralhados: 0,498), um sinal moderado que registrei como limitação. Os dados de produção são simulados sobre uma base de Taiwan de 2005, e a parte jurídica é um desenho técnico que precisa de validação por profissionais do direito.", "next": "Voltar para todos os projetos ↗", "report": "Ver relatório de drift ↗", "live": "Replay ao vivo ↗"}, "en": {"back": "← Back to site", "eyebrow": "Technical case · Production model observability", "h1a": "Credit Scoring", "h1b": "Observability", "lead": "A credit model keeps answering even when it gets worse: nothing crashes, but decisions silently degrade. This project is the layer that notices — data contract, drift detection, alerts, dashboards, root-cause analysis and LGPD-oriented governance.", "github": "GitHub ↗", "lab": "← See other projects", "m1": "AUC: BASELINE → PERIOD 4", "m2": "AUC DROP FROM CONCEPT DRIFT ALONE", "m3": "BAD BATCH BLOCKED (VIOLATIONS)", "p1e": "01 · Problem", "p1h": "A model can get worse without throwing a single error.", "p1c": "A lender ships a scoring model with an AUC of 0.791. Months later, bills grow, more customers pay late and the portfolio gets younger. The model keeps answering, but approves and denies the wrong people. The challenge is to notice early, understand the cause and know what to do. I used the public UCI Default of Credit Card Clients dataset (30,000 customers, Taiwan, 2005) and simulated four production periods with growing degradation.", "p2e": "02 · Data quality", "p2h": "Bad data is stopped before it becomes a decision.", "p2c": "Every batch goes through a data contract (Pandera) before reaching the model: age between 18 and 100, valid categories, unique ids, non-negative payments and no unexpected columns. I deliberately corrupted 500 rows and the contract reported 81 violations across 7 checks, blocked the batch and exited with an error. Training also refuses to run on data that fails the contract.", "dec": "Design decision", "decc": "The contract checks validity, not similarity. A batch with higher incomes is valid; noticing that it changed is the drift layer's job. Keeping the two apart avoids blocking legitimate data just because the world moved.", "p3e": "03 · Drift and cause", "p3h": "High drift does not mean lost performance.", "p3c": "I compared each period with the reference using PSI (how much a distribution moved) and KS (whether the difference is statistically real), with Evidently reports. From the first to the fourth period, AUC fell from 0.788 to 0.649. To find out why, I switched on one cause at a time in the simulator, with 30 repetitions. All input shifts together cost about 0.011 of AUC; the change in payment behavior (concept drift) alone cost 0.128.", "dec2": "What this shows", "decc2": "Features such as age (PSI 0.50) crossed the alert threshold but barely affected the model. The damage came from a change in the relationship between profile and default, which only performance reveals. That is why the AUC-drop alert fires one batch before the PSI alert. The analysis holds for the simulator and the proportions depend on the intensities I chose.", "p4e": "04 · Engineering", "p4h": "From a one-off report to a system that watches by itself.", "s1": "Validates the contract, blocks invalid batches and stops training on bad data. 81 violations caught in the test batch.", "s2": "PSI and KS per feature and period, with HTML reports. Features I did not alter stay quiet: the detector points at the right culprits.", "s3": "Each batch goes through contract, scoring, drift and alert rules (critical or warning), with JSON logs that hold no row-level data and per-batch metrics in MLflow.", "s4": "Metrics exposed with prometheus_client, alert rules and an automatically provisioned 13-panel dashboard. The full replay produced 7 critical alerts.", "s5": "Interventional experiment: seven scenarios, one cause at a time, 30 seeds each. It separates the effect of the data from the effect of the concept.", "s6": "Tests for the alert rules, the contract and the simulator, and GitHub Actions running the suite on every push. Tests that need the real data are skipped in CI.", "p5e": "05 · Governance", "p5h": "LGPD and fairness are part of the system, not an appendix.", "p5c": "The repository documents the data inventory, legal basis (Art. 7, X, credit protection), the right to review automated decisions (Art. 20), a retention plan and an operating playbook. Sex and id are kept out of the model. I audited flag rates, TPR and FPR by sex, age band and marital status, and tested whether the other features can predict sex.", "dec3": "Acknowledged limit", "decc3": "The proxy test predicted sex with an AUC of 0.649 (shuffled-label control: 0.498), a moderate signal that I recorded as a limitation. Production data is simulated on a 2005 Taiwanese dataset, and the legal part is a technical design that needs review by legal professionals.", "next": "Back to all projects ↗", "report": "View drift report ↗", "live": "Live replay ↗"}}; let lang=localStorage.getItem("gf-lang")||"pt"; if(!C[lang])lang="pt";
const ids=["back", "eyebrow", "h1a", "h1b", "lead", "live", "github", "report", "lab", "p1e", "p1h", "p1c", "p2e", "p2h", "p2c", "dec", "decc", "p3e", "p3h", "p3c", "dec2", "decc2", "p4e", "p4h", "s1", "s2", "s3", "s4", "s5", "s6", "p5e", "p5h", "p5c", "dec3", "decc3", "next"];
function render(){
 const t=C[lang]; document.documentElement.lang=lang==="pt"?"pt-BR":"en";
 ids.forEach(id=>{const el=document.getElementById(id); if(el && t[id]!==undefined)el.textContent=t[id];});
 document.querySelectorAll(".metric span").forEach(el=>el.textContent=t[el.dataset.k]);
 document.getElementById("pt").classList.toggle("active",lang==="pt");document.getElementById("en").classList.toggle("active",lang==="en");
}
document.getElementById("pt").onclick=()=>{lang="pt";localStorage.setItem("gf-lang",lang);render()};
document.getElementById("en").onclick=()=>{lang="en";localStorage.setItem("gf-lang",lang);render()};
document.getElementById("year").textContent=new Date().getFullYear(); render();
</script></body></html>
